name: Page 01 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/create_run_summary.py"
      - "pyproject.toml"
      - "input/**"
      - ".github/workflows/page01-validation.yml"

jobs:
  validate-page-01:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2

      - name: Install Interlab and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest

      - name: Report dependency versions
        run: |
          python - <<'PY'
          import sys
          import cairosvg
          import cv2
          import fitz
          import numpy
          import PIL
          import shapely

          print("Python:", sys.version.replace("\n", " "))
          print("PyMuPDF:", fitz.VersionBind)
          print("Shapely:", shapely.__version__)
          print("NumPy:", numpy.__version__)
          print("Pillow:", PIL.__version__)
          print("OpenCV:", cv2.__version__)
          print("CairoSVG:", cairosvg.__version__)
          PY

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run unit tests
        run: pytest -q

      - name: Locate and validate inputs
        shell: bash
        run: |
          set -euo pipefail
          pdf='input/Floorplan.pdf'
          archive='input/Планировки.zip'
          [[ -f "$pdf" ]] || { echo "::error::Required PDF is missing: $pdf"; exit 1; }
          [[ -f "$archive" ]] || { echo "::error::Required reference archive is missing: $archive"; exit 1; }

          reference_root='/tmp/interlab-references'
          rm -rf "$reference_root"
          mkdir -p "$reference_root"
          unzip -q "$archive" -d "$reference_root"
          mapfile -d '' matches < <(find "$reference_root" -type f -name '01.png' -print0)
          if (( ${#matches[@]} == 0 )); then
            echo "::error::Reference image 01.png was not found in $archive"
            exit 1
          fi
          if (( ${#matches[@]} > 1 )); then
            echo "::error::Multiple reference images named 01.png were found in $archive"
            printf 'Candidate: %s\n' "${matches[@]}"
            exit 1
          fi
          reference="${matches[0]}"
          echo "Reference path: $reference"
          echo "PDF size (bytes): $(stat -c %s "$pdf")"
          echo "PNG size (bytes): $(stat -c %s "$reference")"
          checksum="$(sha256sum "$pdf" | cut -d ' ' -f 1)"
          echo "PDF SHA-256: $checksum"
          printf '%s\n' "$checksum" > /tmp/interlab-pdf-sha256-before
          echo "INTERLAB_REFERENCE=$reference" >> "$GITHUB_ENV"

      - name: Run real page-one processing pipeline
        run: interlab input/Floorplan.pdf "$INTERLAB_REFERENCE" --output output

      - name: Verify required outputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            output/diagnostics.json
            output/page_01_extracted.svg
            output/page_01_normalized.svg
            output/page_01_normalization_stats.json
            output/page_01_reference_alignment.json
            output/page_01_apartment_seeds.json
            output/page_01/apartment_test_01.svg
            output/page_01/apartment_test_01.png
            output/page_01/apartment_test_01.json
            output/validation/page_01_original.png
            output/validation/page_01_extracted.png
            output/validation/page_01_normalized.png
            output/validation/page_01_extracted_diff.png
            output/validation/page_01_normalized_diff.png
            output/validation/page_01_reference_alignment_overlay.png
            output/validation/validation.json
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "::error::Required output is missing or empty: $path"
              missing=1
            else
              echo "Verified: $path"
            fi
          done
          (( missing == 0 )) || exit 1

      - name: Verify immutable PDF checksum
        shell: bash
        run: |
          set -euo pipefail
          before="$(cat /tmp/interlab-pdf-sha256-before)"
          after="$(sha256sum input/Floorplan.pdf | cut -d ' ' -f 1)"
          echo "PDF SHA-256 after processing: $after"
          if [[ "$before" != "$after" ]]; then
            echo "::error::Immutable source PDF checksum changed (before=$before, after=$after)"
            exit 1
          fi

      - name: Create run summaries
        run: python scripts/create_run_summary.py output

      - name: Publish job summary
        run: cat output/run_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: interlab-page01-validation
          path: output/
          if-no-files-found: error
          retention-days: 14
